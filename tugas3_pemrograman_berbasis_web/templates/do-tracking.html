<template id="tpl-do-tracking">
<div>
    <div style="padding: 0 0 15px 0;">
        <h2 style="margin: 0; font-size: 22px; color: #111;">Tracking Delivery Order</h2>
    </div>

    <!-- Form Tambah DO Baru -->
    <div class="card">
        <h3>Tambah DO Baru</h3>
        <table class="form-table">
            <tr>
                <td class="label-col">NIM</td>
                <td><input type="text" v-model="formDO.nim" placeholder="Masukkan NIM"></td>
            </tr>
            <tr>
                <td class="label-col">Nama</td>
                <td><input type="text" v-model="formDO.nama" placeholder="Masukkan Nama"></td>
            </tr>
            <tr>
                <td class="label-col">Paket</td>
                <td>
                    <select v-model="formDO.paket">
                        <option value="">Pilih Paket</option>
                        <option v-for="(p, index) in actualPaketList" :key="index" :value="typeof p === 'object' ? p.nama : p">
                            {{ typeof p === 'object' ? p.nama : p }}
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">Harga</td>
                <td><strong>{{ formatCurrency(formDO.harga) }}</strong></td>
            </tr>
        </table>

        <div style="margin-top: 15px;">
            <button class="btn btn-primary" @click="submitDO">Tambah DO</button>
        </div>
    </div>

    <!-- Kotak Pencarian -->
    <div class="card" style="margin-top: 15px; padding: 15px 20px;">
        <div style="font-size: 12px; color: #666; margin-bottom: 5px;">Tekan ESC untuk reset pencarian</div>
        <div style="display: flex; gap: 10px;">
            <input type="text" v-model="searchQuery" placeholder="Cari Nomor DO atau NIM..." class="form-control" style="flex: 1;" @keyup.esc="searchQuery = ''">
            <button class="btn btn-primary">Cari</button>
        </div>
    </div>

    <!-- Tabel Data Tracking DO -->
    <div class="card" style="padding: 0; overflow: hidden; margin-top: 15px;">
        <table class="data-table">
            <thead>
                <tr>
                    <th>No DO</th>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Status</th>
                    <th>Ekspedisi</th>
                    <th>Paket</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <template v-for="(item, index) in filteredTracking">
                    <tr v-for="(val, noDO) in item" :key="noDO + index">
                        <td><strong>{{ noDO }}</strong></td>
                        <td>{{ val.nim }}</td>
                        <td>{{ val.nama }}</td>
                        <td>{{ val.status }}</td>
                        <td>{{ val.ekspedisi || 'JNE' }}</td>
                        <td>{{ val.paket }}</td>
                        <td>{{ formatCurrency(val.total) }}</td>
                    </tr>
                </template>
                <tr v-if="filteredTracking.length === 0">
                    <td colspan="7" style="text-align: center; padding: 20px;">Data tracking tidak ditemukan.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</template>
