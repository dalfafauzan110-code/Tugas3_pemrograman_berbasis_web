<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITTA UT - Pemesanan & Stok Bahan Ajar</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Tempat menampung file template eksternal secara otomatis -->
  <div id="template-container" style="display: none;"></div>

  <div id="app">
    <!-- Header Banner UT -->
    <div class="header-banner">
      <h1>Sistem Pemesanan Bahan Ajar UT</h1>
      <p>Sistem Informasi Tracking dan Pemesanan Bahan Ajar Universitas Terbuka</p>
    </div>

    <!-- Navigasi Tab -->
    <nav>
      <button :class="{ active: tab === 'stok' }" @click="tab = 'stok'">Stok Bahan Ajar</button>
      <button :class="{ active: tab === 'pemesanan' }" @click="tab = 'pemesanan'">Pemesanan</button>
      <button :class="{ active: tab === 'tracking' }" @click="tab = 'tracking'">Tracking DO</button>
    </nav>

    <div class="container">
      <!-- Halaman Stok Bahan Ajar -->
      <section v-show="tab === 'stok'">
        <ba-stock-table 
          :items="stok" 
          :upbjj-list="upbjjlist" 
          :kategori-list="kategorilist"
          @add-item="handleAddItem"
          @update-item="handleUpdateItem"
          @request-delete="handleRequestDelete">
        </ba-stock-table>
      </section>

      <!-- Halaman Pemesanan -->
      <section v-show="tab === 'pemesanan'">
        <order-form 
          :paket-list="paketList" 
          :pengiriman-list="pengirimanlist"
          @add-order="handleaddOrder">
        </order-form>
      </section>

      <!-- Halaman Tracking DO -->
      <section v-show="tab === 'tracking'">
        <do-tracking 
          :tracking-list="tracking"
          :paket-list="paketList"
          @add-order="handleaddOrder">
        </do-tracking>
      </section>
    </div>

    <!-- Komponen Modal Konfirmasi -->
    <app-modal ref="modal"></app-modal>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

  <script>
    async function initApp() {
      const templateFiles = [
        'templates/status-badge.html',
        'templates/app-modal.html',
        'templates/stock-table.html',
        'templates/order-form.html',
        'templates/do-tracking.html'
      ];

      const container = document.getElementById('template-container');

      for (const file of templateFiles) {
        try {
          const response = await fetch(file);
          if (response.ok) {
            const html = await response.text();
            container.innerHTML += html;
          } else {
            console.error('Gagal memuat template:', file);
          }
        } catch (e) {
          console.error('Error fetching template:', file, e);
        }
      }

      const scripts = [
        'js/services/api.js',
        'js/components/status-badge.js',
        'js/components/app-modal.js',
        'js/components/stock-table.js',
        'js/components/order-form.js',
        'js/components/do-tracking.js',
        'js/app.js'
      ];

      for (const src of scripts) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
