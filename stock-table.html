<template id="tpl-stock">
<div>
    <!-- Header Judul Halaman -->
    <div style="padding: 0 0 15px 0;">
        <h2 style="margin: 0; font-size: 22px; color: #111;">Data Stok Bahan Ajar</h2>
    </div>

    <!-- Card Tambah/Edit Data Stok -->
    <div class="card">
        <h3>{{ form.isEdit ? 'Edit Data Stok' : 'Tambah Data Stok' }}</h3>
        <table class="form-table" @keyup.enter="saveForm">
            <tr>
                <td class="label-col">Kode</td>
                <td><input type="text" v-model="form.kode" placeholder="Misal: EKMA4116"></td>
            </tr>
            <tr>
                <td class="label-col">Judul</td>
                <td><input type="text" v-model="form.judul" placeholder="Nama Mata Kuliah"></td>
            </tr>
            <tr>
                <td class="label-col">Kategori</td>
                <td>
                    <select v-model="form.kategori">
                        <option value="">Pilih Kategori</option>
                        <option v-for="k in kategoriList" :key="k" :value="k">{{ k }}</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">UPBJJ</td>
                <td>
                    <select v-model="form.upbjj">
                        <option value="">Pilih UPBJJ</option>
                        <option v-for="u in upbjjList" :key="u" :value="u">{{ u }}</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">Lokasi Rak</td>
                <td><input type="text" v-model="form.lokasiRak" placeholder="Contoh: R1-A3"></td>
            </tr>
            <tr>
                <td class="label-col">Harga</td>
                <td><input type="number" v-model.number="form.harga"></td>
            </tr>
            <tr>
                <td class="label-col">Qty</td>
                <td><input type="number" v-model.number="form.qty"></td>
            </tr>
            <tr>
                <td class="label-col">Safety</td>
                <td><input type="number" v-model.number="form.safety"></td>
            </tr>
        </table>

        <div style="margin-top: 15px;">
            <button class="btn btn-primary" @click="saveForm">{{ form.isEdit ? 'Update Data' : 'Tambah Data' }}</button>
            <button v-if="form.isEdit" class="btn btn-secondary" @click="resetForm" style="margin-left: 10px;">Batal</button>
        </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="card" style="padding: 15px 20px; margin-top: 15px;">
        <div class="filter-bar" style="display: flex; gap: 10px; align-items: center;">
            <!-- Input Cari Judul -->
            <input type="text" v-model="searchQuery" placeholder="Cari Judul..." class="form-control" style="flex: 1;">
            
            <!-- Select UPBJJ -->
            <select v-model="selectedUpbjj" style="width: 150px;">
                <option value="">Semua UPBJJ</option>
                <option v-for="u in upbjjList" :key="u" :value="u">{{ u }}</option>
            </select>

            <!-- Select Kategori -->
            <select v-model="selectedKategori" style="width: 150px;">
                <option value="">Semua Kategori</option>
                <option v-for="k in kategoriList" :key="k" :value="k">{{ k }}</option>
            </select>

            <button class="btn btn-primary" @click="resetFilters">Reset Filter</button>
        </div>
    </div>

    <!-- Tabel Data Stok -->
    <div class="card" style="padding: 0; overflow: hidden; margin-top: 15px;">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Judul</th>
                    <th>Kategori</th>
                    <th>UPBJJ</th>
                    <th>Lokasi Rak</th>
                    <th>Harga</th>
                    <th>Qty</th>
                    <th>Safety</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <!-- Perulangan menggunakan filteredAndSortedItems -->
                <tr v-for="(item, ins) in filteredAndSortedItems" :key="item.kode">
                    <td>{{ item.kode }}</td>
                    <td><strong>{{ item.judul }}</strong></td>
                    <td>{{ item.kategori }}</td>
                    <td>{{ item.upbjj }}</td>
                    <td>{{ item.lokasiRak }}</td>
                    <td>{{ formatCurrency(item.harga) }}</td>
                    <td><input type="number" v-model.number="item.qty" style="width: 60px; padding: 4px;"></td>
                    <td><input type="number" v-model.number="item.safety" style="width: 60px; padding: 4px;"></td>
                    <td><status-badge :qty="item.qty" :safety="item.safety" :catatan="item.catatanHTML"></status-badge></td>
                    
                    <td>
                        <button class="btn btn-danger" @click="confirmDelete(item.kode)" style="padding: 4px 8px; font-size: 12px;">Hapus</button>
                    </td>
                </tr>
                <tr v-if="filteredAndSortedItems.length === 0">
                    <td colspan="10" style="text-align: center; padding: 20px;">Data tidak ditemukan.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</template>
