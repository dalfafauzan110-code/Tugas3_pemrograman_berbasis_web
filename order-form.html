<template id="tpl-order">
<div>
    <div style="padding: 0 0 15px 0;">
        <h2 style="margin: 0; font-size: 22px; color: #111;">Formulir Pemesanan Bahan Ajar</h2>
    </div>

    <div class="card">
        <h3>Buat Pesanan Baru</h3>
        <table class="form-table">
            <tr>
                <td class="label-col">NIM</td>
                <td><input type="text" v-model="formOrder.nim" placeholder="Masukkan NIM"></td>
            </tr>
            <tr>
                <td class="label-col">Nama</td>
                <td><input type="text" v-model="formOrder.nama" placeholder="Masukkan Nama"></td>
            </tr>
            <tr>
                <td class="label-col">Paket</td>
                <td>
                    <select v-model="formOrder.paket">
                        <option value="">Pilih Paket</option>
                        <option v-for="(p, index) in actualPaketList" :key="index" :value="typeof p === 'object' ? p.nama : p">
                            {{ typeof p === 'object' ? p.nama : p }}
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">Pengiriman</td>
                <td>
                    <select v-model="formOrder.ekspedisi">
                        <option value="">Pilih Pengiriman</option>
                        <option v-for="(e, index) in actualPengirimanList" :key="index" :value="typeof e === 'object' ? e.nama : e">
                            {{ typeof e === 'object' ? e.nama : e }}
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label-col">Total Harga</td>
                <td><strong>{{ formatCurrency(selectedPaketDetail ? selectedPaketDetail.harga : 0) }}</strong></td>
            </tr>
        </table>

        <div style="margin-top: 15px;">
            <button class="btn btn-primary" @click="submitOrder">Pesan Sekarang</button>
        </div>
    </div>
</div>
</template>
